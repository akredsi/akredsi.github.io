<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets Frame</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRSF5P-V1XT79sBhneUCaxrlmDFrCqDKLzf0EeuE8huVmZoYnPYhkbl12riDgYzYg/pubhtml?widget=true&amp;headers=false"></iframe>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Data pengguna untuk validasi
            const users = {
                'akredsi@gmail.com': '1234',
                'user2': 'password2'
            };
    
            // Periksa sessionStorage
            const sessionUser = sessionStorage.getItem('email');
            const sessionPassword = sessionStorage.getItem('password');
    
            if (!sessionUser || !sessionPassword || users[sessionUser] !== sessionPassword) {
                // Jika tidak ada data atau data tidak valid, arahkan ke login
                alert("Anda belum login atau sesi Anda tidak valid. Silakan login kembali.");
                window.location.href = "/login.html"; // Ubah sesuai URL login Anda
            }
        });
    </script>
</body>
</html>
